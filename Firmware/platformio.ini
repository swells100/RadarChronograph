; Teensy 4.1 Doppler radar: ADC + FFT + shot-gated bullet detection, streamed over Ethernet and/or USB
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L
upload_protocol = teensy-cli
monitor_speed = 115200
build_flags =
    -O2
    -DUSB_SERIAL
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    ssilverman/QNEthernet@^0.30.0
    lvgl/lvgl@^9.6.0
; LVGL reads include/lv_conf.h (see build_flags). The RA8875 driver + FT5206 touch are in lib/RA8875 (picked up automatically).
; The ADC library (pedvide/ADC) and CMSIS-DSP ship with the Teensy core.
